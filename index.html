<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Enquiry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c2431;
    --bg-2: #222c3c;
    --card: #fbf7ef;
    --card-edge: #f1ead9;
    --ink: #23262b;
    --ink-soft: #6b6b63;
    --accent: #b8863c;
    --accent-dark: #8f6526;
    --line: #e4dcc8;
    --shadow-deep: rgba(0,0,0,0.55);
    --shadow-soft: rgba(0,0,0,0.25);
    --highlight: rgba(255,255,255,0.05);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background: var(--bg);
    font-family:'Inter',sans-serif;
    color: var(--ink);
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px 90px;
    overflow-x:hidden;
  }

  /* flat skyline motif, grounded + low-key */
  .skyline{
    position:fixed;
    left:0; right:0; bottom:0;
    height: 160px;
    z-index:0;
    opacity:0.5;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 480px;
  }

  .eyebrow{
    color:#c9b98a;
    font-size:14px;
    letter-spacing:0.02em;
    margin: 0 0 6px 4px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight:600;
    font-size: clamp(28px, 5vw, 36px);
    line-height:1.15;
    color:#f4efe3;
    margin: 0 0 28px 4px;
  }

  .sub{
    color:#b7bfcf;
    font-size:15px;
    margin: 0 0 28px 4px;
    max-width: 40ch;
  }

  form.card{
    background: var(--card);
    border-radius: 22px;
    padding: 34px 30px 30px;
    box-shadow:
      0 1px 0 var(--highlight) inset,
      0 30px 60px -20px var(--shadow-deep),
      0 12px 24px -12px var(--shadow-soft);
    transform: translateZ(0);
  }

  .field{
    margin-bottom: 18px;
  }

  .field label{
    display:block;
    font-size: 12.5px;
    font-weight:600;
    color: var(--ink-soft);
    margin-bottom: 7px;
    letter-spacing: 0.01em;
  }

  .field input,
  .field select{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size: 15.5px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.05), 0 1px 0 #fff;
    transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    appearance:none;
    -webkit-appearance:none;
  }

  .field select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%236b6b63' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position: right 14px center;
    padding-right: 36px;
  }

  .field input:focus,
  .field select:focus{
    outline:none;
    border-color: var(--accent);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.05), 0 0 0 3px rgba(184,134,60,0.18);
    transform: translateY(-1px);
  }

  .row2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  button.submit{
    width:100%;
    margin-top: 8px;
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size: 15.5px;
    color:#2b1c07;
    background: var(--accent);
    padding: 15px 18px;
    border-radius: 12px;
    box-shadow: 0 10px 20px -8px rgba(184,134,60,0.55), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }

  button.submit:hover{ background: #c3924a; }

  button.submit:active{
    transform: translateY(2px);
    box-shadow: 0 4px 10px -6px rgba(184,134,60,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .foot-note{
    text-align:center;
    color:#8892a3;
    font-size:12.5px;
    margin-top:16px;
  }

  .success{
    display:none;
    text-align:center;
    padding: 46px 30px 40px;
  }

  .success.show{ display:block; }
  form.card.hide{ display:none; }

  .success .mark{
    width:56px;height:56px;border-radius:50%;
    background: var(--accent);
    display:flex;align-items:center;justify-content:center;
    margin: 0 auto 18px;
    box-shadow: 0 10px 20px -8px rgba(184,134,60,0.55);
  }

  .success h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin: 0 0 8px;
    font-size: 22px;
  }

  .success p{
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 0 0 22px;
  }

  .success button{
    border:none;
    background:transparent;
    color: var(--accent-dark);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    text-decoration: underline;
  }

  .req{ color:#a4432f; }

  @media (max-width:420px){
    .row2{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<svg class="skyline" viewBox="0 0 800 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="70" width="60" height="90" fill="#2a3346"/>
  <rect x="70" y="40" width="45" height="120" fill="#232b3c"/>
  <rect x="125" y="90" width="70" height="70" fill="#2a3346"/>
  <rect x="205" y="20" width="50" height="140" fill="#1f2636"/>
  <rect x="265" y="60" width="55" height="100" fill="#2a3346"/>
  <rect x="330" y="95" width="40" height="65" fill="#232b3c"/>
  <rect x="380" y="35" width="60" height="125" fill="#1f2636"/>
  <rect x="450" y="75" width="50" height="85" fill="#2a3346"/>
  <rect x="510" y="10" width="45" height="150" fill="#232b3c"/>
  <rect x="565" y="55" width="65" height="105" fill="#2a3346"/>
  <rect x="640" y="90" width="45" height="70" fill="#1f2636"/>
  <rect x="695" y="30" width="55" height="130" fill="#232b3c"/>
  <rect x="760" y="70" width="40" height="90" fill="#2a3346"/>
</svg>

<div class="wrap">
  <h1>Property enquiry</h1>

  <form class="card" id="leadForm">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" required placeholder="e.g. Rohan Sharma">
    </div>

    <div class="field">
      <label for="phone">Phone number <span class="req">*</span></label>
      <input type="tel" id="phone" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number">
    </div>

    <div class="field">
      <label for="timeline">Buying timeline</label>
      <select id="timeline" required>
        <option value="" disabled selected>Choose</option>
        <option>15 days</option>
        <option>1 month</option>
        <option>2 months</option>
        <option>3+ months</option>
      </select>
    </div>

    <button type="submit" class="submit" id="submitBtn">Submit enquiry</button>
  </form>

  <div class="success" id="successMsg">
    <div class="mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#2b1c07" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2>Enquiry received</h2>
    <p>We've noted your details and will reach out soon.</p>
    <button id="againBtn">Submit another enquiry</button>
  </div>
</div>

<script>
  // Paste the Web App URL you get after deploying the Apps Script (Step 2 in the guide).
const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw1MxpJW_OSBfJq_ILxeNZsASq2EvhgGcVKHtFJg_F1LHmz4bgJPjMUItW-yjTyj_iJ/exec';

  const form = document.getElementById('leadForm');
  const submitBtn = document.getElementById('submitBtn');
  const successMsg = document.getElementById('successMsg');
  const againBtn = document.getElementById('againBtn');

  form.addEventListener('submit', function(e){
    e.preventDefault();

    const lead = {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      timeline: document.getElementById('timeline').value
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    fetch(SHEET_ENDPOINT, {
      method: 'POST',
      // text/plain avoids a CORS preflight, which Apps Script does not handle.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(lead)
    })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(data.result !== 'success'){ throw new Error(data.error || 'Unknown error'); }
        form.classList.add('hide');
        successMsg.classList.add('show');
      })
      .catch(function(err){
        alert('Something went wrong submitting your enquiry. Please try again.');
        console.error(err);
      })
      .finally(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit enquiry';
      });
  });

  againBtn.addEventListener('click', function(){
    form.reset();
    form.classList.remove('hide');
    successMsg.classList.remove('show');
  });
</script>

</body>
</html>
